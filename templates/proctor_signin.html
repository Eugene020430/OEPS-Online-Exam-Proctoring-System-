<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proctor Sign In - Online Exam Proctoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/signin_style.css">
    <style>
        body {
            padding-top: 80px;
            background-color: #f5f5f5;
        }
        .signin-container {
            max-width: 400px;
            padding: 30px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-control {
            margin-bottom: 15px;
        }
        .btn-primary {
            width: 100%;
            padding: 10px;
            font-size: 18px;
        }
        .alert {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">Exam Proctor</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/enroll">Student</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/proctor_signin">Proctor</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/exam">Start Exam</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="signin-container">
            <h2 class="text-center mb-4">Proctor Sign In</h2>
            <form id="proctorSigninForm">
                <div class="mb-3">
                    <label for="proctorId" class="form-label">Proctor ID</label>
                    <input type="text" class="form-control" id="proctorId" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </div>
            </form>
            
            <div class="alert alert-danger mt-3" id="errorAlert" role="alert">
                <span id="errorMessage"></span>
            </div>
            
            <div class="mt-3 text-center">
                <p>Are you a student? <a href="/enroll">Enroll here</a></p>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('proctorSigninForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('proctorId').value;
            const password = document.getElementById('password').value;
            
            // Send to our new authentication endpoint
            fetch('/authenticate_proctor', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/proctor_dashboard';  //REDIRECTION FROM PROCTOR-SIGNIN
                } else {
                    const errorAlert = document.getElementById('errorAlert');
                    const errorMessage = document.getElementById('errorMessage');
                    errorMessage.textContent = data.message || 'Authentication failed';
                    errorAlert.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                const errorAlert = document.getElementById('errorAlert');
                const errorMessage = document.getElementById('errorMessage');
                errorMessage.textContent = 'An error occurred during authentication';
                errorAlert.style.display = 'block';
            });
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
