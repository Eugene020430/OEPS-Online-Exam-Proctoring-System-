<!DOCTYPE html>
<html>
<head>
    <title>Exam Completed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        .completion-container {
            max-width: 600px;
            padding: 40px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }
        .finish-btn {
            padding: 12px 30px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .finish-btn:hover {
            background-color: #45a049;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            color: #4CAF50;
        }
        .confirmation-id {
            background-color: #f8f8f8;
            padding: 10px 15px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="completion-container">
        <div class="icon">✓</div>
        <h1>Exam Successfully Submitted!</h1>
        <p>Thank you for completing your online exam. Your responses have been recorded.</p>
        
        <div class="confirmation-id">
            Confirmation ID: <span id="confirmationId"></span>
        </div>
        
        <p>You may now close this window. Your session has been securely ended.</p>
        
        <button class="finish-btn" id="finishExamBtn">FINISH EXAM</button>
    </div>

    <script>
        // Generate a random confirmation ID
        function generateConfirmationId() {
            const characters = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < 10; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }
        
        // Display confirmation ID when page loads
        document.addEventListener('DOMContentLoaded', function() {
            const confirmId = generateConfirmationId();
            document.getElementById('confirmationId').textContent = confirmId;
            
            // Store confirmation ID in local storage (optional)
            localStorage.setItem('lastExamConfirmation', confirmId);
            localStorage.setItem('examCompletedAt', new Date().toString());
            
            // Clear any exam-related session data
            sessionStorage.removeItem('examProgress');
            sessionStorage.removeItem('examAnswers');
        });
        
        // Close window when finish button is clicked
        document.getElementById('finishExamBtn').addEventListener('click', function() {
            // Send a request to the server to end the session (optional)
            fetch('/end_exam_session', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: 'end_exam'
                })
            }).finally(() => {
                // Close the window
                window.close();
                
                // If window.close() doesn't work (which is common in modern browsers),
                // redirect to a safe page
                setTimeout(function() {
                    window.location.href = '/';
                }, 500);
            });
        });
    </script>
</body>
</html>
